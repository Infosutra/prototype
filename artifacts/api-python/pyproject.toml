[project]
name = "infosutra-api"
version = "0.1.0"
description = "Infosutra FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "cryptography>=44.0.0",
  "email-validator>=2.2.0",
  "pyyaml>=6.0.3",
  "reportlab>=4.2.0",
  "matplotlib>=3.9.0",
  "python-docx>=1.1.0",
  "alembic>=1.19.0",
  "python-multipart>=0.0.20",
  "sarvamai>=0.1.30",
  "mutagen>=1.47.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "structlog>=25.0.0",
]

[project.scripts]
infosutra-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/assets" = "app/assets"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.1",
    "freezegun>=1.5.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Pre-existing noise across the Phase 5 split; tighten later.
ignore = ["E501", "UP017"]

[tool.ruff.lint.per-file-ignores]
# Re-export modules often look unsorted to isort; keep intentional public order.
"app/domain/**/__init__.py" = ["I001"]
"app/rendering/**/__init__.py" = ["I001"]
"app/repositories/**/__init__.py" = ["I001"]
"app/seeds/**/__init__.py" = ["I001"]
"app/domain/reporting/__init__.py" = ["F401", "I001"]
