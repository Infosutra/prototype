[project]
name = "infosutra-api"
version = "0.1.0"
description = "Infosutra FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "cryptography>=44.0.0",
  "email-validator>=2.2.0",
  "pyyaml>=6.0.3",
  "reportlab>=4.2.0",
  "matplotlib>=3.9.0",
  "python-docx>=1.1.0",
  "alembic>=1.19.0",
]

[project.scripts]
infosutra-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true
